schema: spec-driven

context: |
  Language: russian
  All artifacts must be written in russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Личная CRM: владелец ведёт контакты людей, которых знает лично.
  Владелец не разработчик — пиши простыми словами, термин объясняй при первом упоминании.
  Идея продукта, главный сценарий и ограничения: specs/01-продуктовая-идея.md
  Стек: Next.js (App Router), TypeScript, React, Tailwind CSS, shadcn/ui,
  PostgreSQL + Drizzle (схема и миграции в коде), pnpm.
  Код и всё, что к нему относится, — на английском: имена файлов, переменных, таблиц и полей,
  комментарии, тексты ошибок и логов, коммиты, ветки. На русском — тексты интерфейса.
  Продуктовые решения принимает владелец: чего нет в требованиях — спроси, не додумывай.

rules:
  tasks:
    - Каждый шаг заканчивается проверкой руками: что сделать и что должно получиться

operations:
  apply:
    guidance:
      - Изменения схемы базы — только миграцией Drizzle в коде
      - Сделал шаг — скажи владельцу, как проверить результат руками
