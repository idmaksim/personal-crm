# nginx site config for the CRM TEST STAND (reverse proxy to the stand container).
#
# This is the source of truth for the server's
#   /etc/nginx/sites-available/test-app.dobrymaxx.ru
# It is NOT applied automatically: the server is shared with the landing page and
# prod, so nginx is updated by hand. ONLY add this site — do not touch the prod
# or landing configs, and do not reuse their certificate.
#
# One-time setup on the server (after the test-app DNS record points here):
#
#   # 1. Password file for basic auth (owner picks the password; it is a secret,
#   #    never in git):
#   sudo htpasswd -c /etc/nginx/.htpasswd-test-app <login>
#
#   # 2. Issue a SEPARATE certificate just for test-app (does not touch the
#   #    prod/landing cert at live/dobrymaxx.ru):
#   sudo certbot certonly --nginx -d test-app.dobrymaxx.ru
#
#   # 3. Install this config and enable the site:
#   scp deploy/nginx/test-app.dobrymaxx.ru.conf crm:~/test-app.conf.new
#   ssh crm '
#     sudo cp ~/test-app.conf.new /etc/nginx/sites-available/test-app.dobrymaxx.ru && rm ~/test-app.conf.new
#     sudo ln -sf /etc/nginx/sites-available/test-app.dobrymaxx.ru \
#                 /etc/nginx/sites-enabled/test-app.dobrymaxx.ru
#     sudo nginx -t && sudo systemctl reload nginx'
#
# To change it later, edit this file, scp it over the one above, nginx -t, reload.

server {
    server_name test-app.dobrymaxx.ru;

    # /health is open (no password) so the deploy smoke test and uptime checks
    # can reach it. It only returns {"status":"ok"} — no data is exposed.
    location = /health {
        auth_basic off;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is behind a password (basic auth).
    location / {
        auth_basic "Test stand";
        auth_basic_user_file /etc/nginx/.htpasswd-test-app;

        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    # Separate certificate for the stand only — NOT the shared prod/landing cert.
    ssl_certificate /etc/letsencrypt/live/test-app.dobrymaxx.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test-app.dobrymaxx.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = test-app.dobrymaxx.ru) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name test-app.dobrymaxx.ru;
    return 404;
}
