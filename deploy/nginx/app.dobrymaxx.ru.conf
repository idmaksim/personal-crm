# nginx site config for the CRM app (reverse proxy to the container).
#
# This is the source of truth for the server's
#   /etc/nginx/sites-available/app.dobrymaxx.ru
# It is NOT applied automatically: the server is shared with the landing page,
# so nginx is updated by hand. To apply after changing this file:
#
#   scp deploy/nginx/app.dobrymaxx.ru.conf crm:~/app.conf.new
#   ssh crm '
#     sudo cp -a /etc/nginx/sites-available/app.dobrymaxx.ru \
#                /etc/nginx/sites-available/app.dobrymaxx.ru.bak.$(date +%Y%m%d%H%M%S)
#     sudo cp ~/app.conf.new /etc/nginx/sites-available/app.dobrymaxx.ru && rm ~/app.conf.new
#     sudo nginx -t && sudo systemctl reload nginx'
#
# The TLS certificate is shared with the landing page and already covers both
# dobrymaxx.ru and app.dobrymaxx.ru (single cert at live/dobrymaxx.ru).

server {
    server_name app.dobrymaxx.ru;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dobrymaxx.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dobrymaxx.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = app.dobrymaxx.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name app.dobrymaxx.ru;
    return 404; # managed by Certbot
}
