name: Deploy stand

# Push to main -> build the image -> deploy the TEST STAND -> prune old GHCR
# versions. Production is NOT touched here: prod is deployed only by the manual
# "Deploy prod" workflow. The stand reseeds its database from prod on each deploy,
# so it always shows the new code against a fresh copy of prod's data — a safe
# place to check a change before pressing the prod button.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Serialize with "Deploy prod": both touch the same server and Docker, and the
# stand reseeds from prod's database, so a stand deploy must never overlap a prod
# deploy. The shared literal group name is what links the two workflows.
concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy to server (test stand)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Copy the whole deploy/ folder to the server, so new scripts travel
          # automatically — no workflow change needed per script. scp only
          # adds/overwrites files; it does NOT delete anything already on the
          # server, so ~/deploy/.env, ~/deploy/.env.staging and ~/deploy/backups/
          # (all server-only, not in the repo) are left untouched.
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" "mkdir -p ~/deploy"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -r \
            deploy/. \
            "$SERVER_USER@$SERVER_HOST:~/deploy/"

          # Deploy the stand. deploy.sh skips cleanly if the stand is not
          # configured yet (no ~/deploy/.env.staging on the server).
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "set -e; echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin >/dev/null; bash ~/deploy/deploy.sh '$IMAGE' staging"

  # Every push to main pushes a new image to GHCR, but prod deploys are now rare,
  # so image versions would pile up in GHCR forever. Keep only the newest ones.
  # Images already pulled to the server are unaffected; this only trims GHCR.
  prune-ghcr:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete old image versions (keep the 15 newest)
        uses: actions/delete-package-versions@v5
        with:
          package-name: personal-crm
          package-type: container
          min-versions-to-keep: 15
