name: CI

# Runs on every PR into main. Branch protection requires these checks green
# before a PR can merge.
on:
  pull_request:
    branches: [main]

# A new push to the same PR cancels the previous, still-running CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast static checks: lint, formatting, types, unit tests.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generates .next route/layout types so tsc checks typed routes too.
      - name: Generate Next types
        run: pnpm exec next typegen

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  # Builds the production Docker image (no push) to catch build breakage on PRs.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: personal-crm:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # End-to-end tests (Playwright) against the real app and a real Postgres — no
  # mocks. Playwright builds and starts the app itself (see playwright.config.ts).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # SMTP stub the e2e login helper reads sent mail from via its HTTP API.
      mailpit:
        image: axllent/mailpit:v1.28.2
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql://crm:crm@localhost:5432/crm
      OWNER_EMAIL: owner@example.com
      BETTER_AUTH_SECRET: ci-test-secret-not-used-in-production
      BETTER_AUTH_URL: http://localhost:3100
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASS: ""
      MAIL_FROM: noreply@mail.crm.localhost
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Run e2e tests
        run: pnpm test:e2e
