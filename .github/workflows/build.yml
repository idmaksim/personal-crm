name: Build image

# Reusable workflow: build the app image and push it to GHCR, tagged with the
# commit SHA. Called by "Deploy stand" (on push to main) and "Deploy prod" (the
# manual button), so the build is defined once and both paths produce the same
# image. The caller gets the full image reference back as an output.
on:
  workflow_call:
    outputs:
      image:
        description: Full image reference that was built and pushed
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.img.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute image name
        id: img
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.img.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
