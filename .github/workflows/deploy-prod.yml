name: Deploy prod

# Manual production deploy — the button. Prod is NEVER deployed automatically on
# merge; you run this workflow by hand (Actions -> Deploy prod -> Run workflow).
#
# Three ways to run it:
#   * SHA empty         -> deploy the latest version that passed the test stand
#   * SHA filled in      -> deploy that commit; it must have passed the test
#                           stand, otherwise the run fails
#   * "rollback" ticked  -> roll back to the PREVIOUS prod version (kept on the
#                           server); the SHA field is ignored and the database is
#                           NOT rolled back
#
# Prod does not rebuild: it reuses the image that was built and verified on the
# test stand when the commit was merged. The deployed SHA (or "rollback") is
# written to the run summary.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (leave empty = latest version that passed the test stand)"
        required: false
        type: string
      rollback:
        description: "Roll back to the previous prod version (ignores SHA; the database is not rolled back)"
        required: false
        type: boolean
        default: false

# Share the concurrency group with "Deploy stand" so a prod deploy and a stand
# deploy (which reseeds from prod's database) never run at the same time.
concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve the image to deploy
        id: resolve
        env:
          INPUT_SHA: ${{ inputs.sha }}
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          set -euo pipefail

          # Rollback: the server picks the previous prod version itself.
          if [ "$ROLLBACK" = "true" ]; then
            echo "mode=rollback" >> "$GITHUB_OUTPUT"
            {
              echo "## Deploy prod: ROLLBACK to the previous prod version"
              echo "The database is NOT rolled back."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A successful "Deploy stand" run on main means that commit passed the
          # test stand. headSha is each run's full commit SHA.
          passed="$(gh run list --workflow deploy-stand.yml --branch main -L 50 \
            --json headSha,status,conclusion \
            --jq '[.[] | select(.status=="completed" and .conclusion=="success") | .headSha]')"

          if [ -z "${INPUT_SHA:-}" ]; then
            target="$(printf '%s' "$passed" | jq -r '.[0] // ""')"
            if [ -z "$target" ]; then
              echo "ERROR: no successful test-stand deploy found — nothing to deploy." >&2
              exit 1
            fi
          else
            # Accept a short SHA by prefix-matching the full SHAs that passed.
            target="$(printf '%s' "$passed" | jq -r --arg p "$INPUT_SHA" '[.[] | select(startswith($p))][0] // ""')"
            if [ -z "$target" ]; then
              echo "ERROR: commit '$INPUT_SHA' has not passed the test stand — refusing to deploy it to prod." >&2
              echo "Only a SHA with a successful 'Deploy stand' run can go to prod." >&2
              exit 1
            fi
          fi

          image="ghcr.io/${GITHUB_REPOSITORY,,}:${target}"
          echo "mode=deploy" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          {
            echo "## Deploy prod: \`$target\`"
            echo "Image: \`$image\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to server (production)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          MODE: ${{ steps.resolve.outputs.mode }}
          IMAGE: ${{ steps.resolve.outputs.image }}
        run: |
          set -euo pipefail

          # Copy the whole deploy/ folder to the server, so new scripts travel
          # automatically. scp only adds/overwrites files; it does NOT delete
          # anything already there, so ~/deploy/.env, ~/deploy/.env.staging,
          # ~/deploy/backups/ and the ~/deploy/.prod-* version pointers (all
          # server-only, not in the repo) are untouched.
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" "mkdir -p ~/deploy"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -r \
            deploy/. \
            "$SERVER_USER@$SERVER_HOST:~/deploy/"

          if [ "$MODE" = "rollback" ]; then
            # Rollback uses an image already on the server — no GHCR login needed.
            ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
              "$SERVER_USER@$SERVER_HOST" \
              "set -e; bash ~/deploy/deploy.sh --rollback"
          else
            # Log in to GHCR on the server (to pull the private image), then deploy.
            ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
              "$SERVER_USER@$SERVER_HOST" \
              "set -e; echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin >/dev/null; bash ~/deploy/deploy.sh '$IMAGE'"
          fi

      - name: Install/refresh the daily backup timer
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          # Idempotent: installs the systemd service+timer (or refreshes them if
          # the unit files changed) so the prod database is backed up once a day.
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "set -e; bash ~/deploy/install-backup-timer.sh"
